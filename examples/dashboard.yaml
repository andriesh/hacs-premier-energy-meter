type: vertical-stack
cards:
  - type: picture-entity
    entity: camera.REPLACE_WITH_YOUR_CAMERA_ENTITY
    name: Electricity meter
    camera_view: live
    show_state: false
    show_name: true
  - type: entities
    entities:
      - entity: number.REPLACE_WITH_YOUR_METER_READING_ENTITY
        name: Meter reading
  - type: grid
    columns: 3
    square: true
    cards:
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: Submit reading
        icon: mdi:upload
        tap_action:
          action: perform-action
          perform_action: premier_energy_meter.submit_reading
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        hold_action:
          action: none
  - type: iframe
    url: /local/premier_energy_meter/index.html?v=3
    aspect_ratio: 100%
