type: vertical-stack
cards:
  - type: picture
    image: /api/brands/integration/premier_energy_meter/logo.png
    alt_text: Premier Energy
  - type: picture-entity
    entity: camera.REPLACE_WITH_YOUR_CAMERA_ENTITY
    name: Electricity meter
    camera_view: live
    show_state: false
    show_name: true
  - type: entities
    entities:
      - entity: number.REPLACE_WITH_YOUR_METER_READING_ENTITY
        name: Meter reading
  - type: button
    name: Submit reading
    icon: mdi:upload
    tap_action:
      action: perform-action
      perform_action: premier_energy_meter.submit_reading
