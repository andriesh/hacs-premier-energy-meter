type: vertical-stack
cards:
  - type: picture-entity
    entity: camera.REPLACE_WITH_YOUR_CAMERA_ENTITY
    name: Electricity meter
    camera_view: live
    show_state: false
    show_name: true
  - type: entities
    entities:
      - entity: input_text.premier_energy_meter_reading
        name: Meter reading
  - type: button
    name: Submit reading
    icon: mdi:upload
    tap_action:
      action: perform-action
      perform_action: premier_energy_meter.submit_reading
      data:
        reading: "{{ states('input_text.premier_energy_meter_reading') }}"
